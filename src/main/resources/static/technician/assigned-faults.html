<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assigned Faults | TANESCO</title>

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

</head>


<body data-page="assigned-faults">


<div class="app-layout">


    <aside class="sidebar">


        <div class="sidebar-brand">

            <div class="brand-logo">
                T
            </div>

            <div>

                <h2>
                    TANESCO
                </h2>

                <p>
                    Fault Management
                </p>

            </div>

        </div>


        <nav class="sidebar-nav">


            <a
                href="/technician/dashboard.html"
                class="nav-link"
            >
                Dashboard
            </a>


            <a
                href="/technician/assigned-faults.html"
                class="nav-link active"
            >
                Assigned Faults
            </a>


        </nav>


        <div class="sidebar-footer">

            <button
                class="logout-button"
                onclick="logout()"
            >
                Sign Out
            </button>

        </div>


    </aside>


    <main class="main-content">


        <header class="topbar">


            <div>

                <p class="page-label">
                    TECHNICIAN PORTAL
                </p>

                <h1>
                    Assigned Faults
                </h1>

            </div>


            <div class="user-profile">

                <div
                    class="user-avatar"
                    id="userAvatar"
                >
                    T
                </div>


                <div>

                    <strong id="userFullName">
                        Technician
                    </strong>

                    <span id="userRole">
                        TECHNICIAN
                    </span>

                </div>

            </div>


        </header>


        <div
            id="message"
            class="message"
        ></div>


        <section class="content-card">


            <div class="section-heading">

                <div>

                    <p class="section-label">
                        MY WORK
                    </p>

                    <h2>
                        Fault Assignments
                    </h2>

                    <p class="section-description">
                        These are faults currently assigned
                        to your technician account.
                    </p>

                </div>

            </div>


            <!-- FILTERS -->

            <div class="filter-row">


                <input
                    type="text"
                    id="technicianFaultSearch"
                    placeholder="Search reference, category or area..."
                >


                <select id="technicianStatusFilter">

                    <option value="">
                        All statuses
                    </option>

                    <option value="ASSIGNED">
                        Assigned
                    </option>

                    <option value="IN_PROGRESS">
                        In Progress
                    </option>

                    <option value="RESOLVED">
                        Resolved
                    </option>

                    <option value="CLOSED">
                        Closed
                    </option>

                </select>


            </div>


            <!-- TABLE -->

            <div class="table-wrapper">


                <table>


                    <thead>

                    <tr>

                        <th>Reference</th>

                        <th>Customer</th>

                        <th>Category</th>

                        <th>Area</th>

                        <th>Priority</th>

                        <th>Status</th>

                        <th></th>

                    </tr>

                    </thead>


                    <tbody id="technicianFaultsBody">

                    <tr>

                        <td
                            colspan="7"
                            class="empty-cell"
                        >
                            Loading assigned faults...
                        </td>

                    </tr>

                    </tbody>


                </table>


            </div>


        </section>


    </main>


</div>


<script src="/js/api.js"></script>

<script src="/js/technician.js"></script>


</body>

</html>
