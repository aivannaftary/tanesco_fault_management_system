<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Management | TANESCO</title>

    <link rel="stylesheet"
          href="/css/dashboard.css">
</head>

<body data-page="admin-staff">

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-logo">T</div>

            <div>
                <h2>TANESCO</h2>
                <p>Fault Management</p>
            </div>

        </div>

        <nav class="sidebar-nav">

            <a href="/admin/dashboard.html"
               class="nav-link">
                Dashboard
            </a>

            <a href="/admin/staff.html"
               class="nav-link active">
                Staff Management
            </a>

            <a href="/admin/create-staff.html"
               class="nav-link">
                Create Staff
            </a>

        </nav>

        <div class="sidebar-footer">

            <button class="logout-button"
                    onclick="logout()">
                Sign Out
            </button>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <p class="page-label">
                    ADMIN PORTAL
                </p>

                <h1>Staff Management</h1>

            </div>

            <div class="user-profile">

                <div class="user-avatar"
                     id="userAvatar">
                    A
                </div>

                <div>

                    <strong id="userFullName">
                        Administrator
                    </strong>

                    <span id="userRole">
                        ADMIN
                    </span>

                </div>

            </div>

        </header>


        <div id="message"
             class="message"></div>


        <section class="content-card">

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        SYSTEM USERS
                    </p>

                    <h2>Staff Accounts</h2>

                    <p class="section-description">
                        View administrators, officers
                        and technicians registered in
                        the system.
                    </p>

                </div>

                <a href="/admin/create-staff.html"
                   class="primary-button">
                    Create Staff
                </a>

            </div>


            <div class="filter-row">

                <input type="text"
                       id="staffSearch"
                       placeholder="Search name, username or email...">


                <select id="roleFilter">

                    <option value="">
                        All Roles
                    </option>

                    <option value="ADMIN">
                        Admin
                    </option>

                    <option value="OFFICER">
                        Officer
                    </option>

                    <option value="TECHNICIAN">
                        Technician
                    </option>

                </select>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>

                    </thead>

                    <tbody id="staffTableBody">

                    <tr>

                        <td colspan="5"
                            class="empty-cell">
                            Loading staff...
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>

</body>
</html>
