<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Faults | TANESCO</title>

    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body data-page="my-faults">

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="brand-logo">T</div>

            <div>
                <h2>TANESCO</h2>
                <p>Fault Management</p>
            </div>
        </div>

        <nav class="sidebar-nav">

            <a href="/customer/dashboard.html" class="nav-link">
                Dashboard
            </a>

            <a href="/customer/report-fault.html" class="nav-link">
                Report Fault
            </a>

            <a href="/customer/my-faults.html"
               class="nav-link active">
                My Faults
            </a>

        </nav>

        <div class="sidebar-footer">
            <button class="logout-button" onclick="logout()">
                Sign Out
            </button>
        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <p class="page-label">CUSTOMER PORTAL</p>
                <h1>My Faults</h1>
            </div>

            <div class="user-profile">

                <div class="user-avatar" id="userAvatar">
                    C
                </div>

                <div>
                    <strong id="userFullName">
                        Customer
                    </strong>

                    <span id="userRole">
                        CUSTOMER
                    </span>
                </div>

            </div>

        </header>


        <div id="message" class="message"></div>


        <section class="content-card">

            <div class="section-heading">

                <div>
                    <p class="section-label">
                        COMPLAINT HISTORY
                    </p>

                    <h2>Reported Faults</h2>
                </div>

                <a href="/customer/report-fault.html"
                   class="primary-action">

                    + Report Fault
                </a>

            </div>


            <div class="filter-row">

                <input
                        type="text"
                        id="faultSearch"
                        placeholder="Search reference, category or area..."
                >

                <select id="statusFilter">

                    <option value="">
                        All statuses
                    </option>

                    <option value="SUBMITTED">
                        Submitted
                    </option>

                    <option value="ASSIGNED">
                        Assigned
                    </option>

                    <option value="IN_PROGRESS">
                        In Progress
                    </option>

                    <option value="RESOLVED">
                        Resolved
                    </option>

                    <option value="CLOSED">
                        Closed
                    </option>

                </select>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Category</th>
                        <th>Area</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Reported</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody id="faultsTableBody">

                    <tr>
                        <td colspan="7" class="empty-cell">
                            Loading faults...
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="/js/api.js"></script>
<script src="/js/customer.js"></script>

</body>
</html>
