# ==========================================================
# APPLICATION
# ==========================================================

spring.application.name=tanesco-fault-management-system

server.port=8080


# ==========================================================
# MYSQL DATABASE
# ==========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/tanesco_fault_management?useSSL=false&serverTimezone=Africa/Dar_es_Salaam&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}


# ==========================================================
# JPA / HIBERNATE
# ==========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================================
# JWT SECURITY
# ==========================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=86400000


# ==========================================================
# FILE UPLOAD
# ==========================================================

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB